command_allowlist:
- /root/.local/bin/yt-dlp
- /usr/bin/sort
- stop/restart hermes gateway (kills running agents)
- /usr/bin/mkdir
- /usr/bin/bash
- stop/restart system service
- /root/.openclaw/workspace/node_modules/.bin/mcporter
- shell command via -c/-lc flag
- /usr/bin/wc
- /usr/bin/grep
- /usr/bin/which
- /usr/local/bin/gh
- script execution via -e/-c flag
- /root/.local/bin/agent-reach
- /root/.nvm/versions/node/v22.22.0/bin/openclaw
- /usr/bin/find
- hermes update (restarts gateway, kills running agents)
- force kill processes
- overwrite system config
- /usr/bin/python3
- /root/.nvm/versions/node/v22.22.0/bin/npm
- /usr/bin/curl
- /usr/bin/sed
- script execution via heredoc
- kill hermes/gateway process (self-termination)
- /usr/bin/true
- /usr/bin/chmod
- kill process via pgrep expansion (self-termination)
- /usr/bin/git
- /usr/bin/printf
